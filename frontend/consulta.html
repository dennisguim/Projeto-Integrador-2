<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Viabilidade - SEMEPP Sorocaba</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar
      </a>
      <h2>Viabilidade Espacial</h2>
      <button id="theme-toggle" class="btn-icon"></button>
    </header>

    <main class="content">
      <!-- Seletor Switch: Ambulante vs Fixo -->
      <div class="glass-card search-card-container">
        <div class="trade-type-container">
          <div class="trade-type-selector">
            <button class="trade-option active" id="opt-ambulante" onclick="setTipoComercio('ambulante')">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
              Ambulante
            </button>
            <button class="trade-option" id="opt-fixo" onclick="setTipoComercio('fixo')">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building-2"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>
              Fixo
            </button>
          </div>
        </div>

        <!-- Campo de Pesquisa com Autocomplete + Entrada Opcional do CNAE -->
        <div class="search-box">
          <div class="search-input-wrapper">
            <input type="text" id="address-input" placeholder="Digite o endereço ou nome do local em Sorocaba..." autocomplete="off" />
            <div id="suggestions-list" class="suggestions-list hidden"></div>
          </div>
          
          <div class="cnae-input-wrapper">
            <input type="text" id="cnae-input" placeholder="CNAE (opcional)" autocomplete="off" />
          </div>

          <button id="search-btn" class="btn-search" onclick="buscarEndereco()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            Consultar
          </button>
        </div>
      </div>

      <!-- Container do Mapa -->
      <div class="glass-card map-card">
        <div id="map"></div>
      </div>

      <!-- Card do Resultado -->
      <div id="result-card" class="glass-card hidden">
        <h3>Parecer de Viabilidade</h3>
        <div id="parecer-badge" class="badge"></div>
        <p style="margin-top: 10px;"><strong>Modalidade:</strong> <span id="res-tipo"></span></p>
        <p><strong>Zonamento Código:</strong> <span id="res-zona-codigo" class="zone-code-tag"></span></p>
        <p><strong>Descrição da Zona (Lei 13.123/2025):</strong> <span id="res-zona"></span></p>
        
        <!-- Bloco de Categorias de Uso Gerais Permitidas -->
        <p style="margin-top: 10px;"><strong>Categorias de Uso Permitidas (Art. 118):</strong></p>
        <div id="res-usos-permitidos" class="uses-container"></div>

        <!-- NOVO: Bloco de Resultado do CNAE (Injetado dinamicamente se preenchido) -->
        <div id="cnae-verdict-box" class="cnae-verdict-box hidden">
          <p><strong>Cruzamento de Atividade (CNAE):</strong></p>
          <div id="cnae-badge" class="cnae-badge"></div>
          <p id="cnae-justificativa" class="cnae-justificativa-text"></p>
        </div>

        <p style="margin-top: 10px;"><strong>Justificativa Legal:</strong></p>
        <p id="res-justificativa" class="justificativa-text"></p>
        
        <div id="req-container" style="margin-top: 12px; text-align: left;">
          <strong style="font-size: 0.9rem; color: var(--primary-gold); display: flex; align-items: center; gap: 6px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clipboard-list"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>
            Condições e Requisitos Municipais:
          </strong>
          <ul id="res-requisitos" style="margin-top: 8px; padding-left: 20px; font-size: 0.85rem; line-height: 1.4; color: var(--text-muted);"></ul>
        </div>
      </div>
    </main>
  </div>

  <!-- Leaflet JS & Banco Decreto 30.529/2025 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script src="js/decreto30529_db.js"></script>
  <script src="js/consulta.js"></script>
</body>
</html>
