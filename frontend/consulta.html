<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Viabilidade - SEMEPP Sorocaba</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <a href="index.html" class="back-btn">⬅ Voltar</a>
      <h2>Viabilidade Espacial</h2>
      <button id="theme-toggle" class="theme-btn">🌙</button>
    </header>

    <main class="content">
      <!-- Seletor Switch: Ambulante vs Fixo -->
      <div class="glass-card">
        <label style="font-weight: 600; display: block; margin-bottom: 8px; font-size: 0.9rem;">
          Selecione a Modalidade Pretendida:
        </label>
        <div class="trade-type-selector">
          <div class="trade-option active" id="opt-ambulante" onclick="setTipoComercio('ambulante')">
            🛒 Comércio Ambulante
          </div>
          <div class="trade-option" id="opt-fixo" onclick="setTipoComercio('fixo')">
            🏢 Comércio Fixo
          </div>
        </div>

        <div class="search-box">
          <input type="text" id="address-input" placeholder="Digite o endereço ou nome do local em Sorocaba..." />
          <button id="search-btn" onclick="buscarEndereco()">🔍 Consultar</button>
        </div>
      </div>

      <!-- Container do Mapa -->
      <div class="glass-card map-card">
        <div id="map"></div>
      </div>

      <!-- Card do Resultado -->
      <div id="result-card" class="glass-card hidden">
        <h3>Parecer de Viabilidade</h3>
        <div id="parecer-badge" class="badge"></div>
        <p style="margin-top: 10px;"><strong>Modalidade:</strong> <span id="res-tipo"></span></p>
        <p><strong>Zoneamento (Lei 13.123/2025):</strong> <span id="res-zona"></span></p>
        <p><strong>Justificativa Legal:</strong></p>
        <p id="res-justificativa" class="justificativa-text"></p>
        
        <div id="req-container" style="margin-top: 12px; text-align: left;">
          <strong style="font-size: 0.9rem; color: var(--primary-color);">📋 Condições e Requisitos Municipais:</strong>
          <ul id="res-requisitos" style="margin-top: 6px; padding-left: 20px; font-size: 0.85rem; line-height: 1.4;"></ul>
        </div>
      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script src="js/consulta.js"></script>
</body>
</html>
