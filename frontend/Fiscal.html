<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMEPP Sorocaba - Área do Fiscal de Posturas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- HTML5 QR Code Scanner via CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- CSS Principal -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .fiscal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 850px) {
      .fiscal-grid {
        grid-template-columns: 1fr;
      }
    }

    .scanner-card, .vistoria-card {
      backdrop-filter: blur(16px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--glass-shadow);
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.5);
      color: var(--text-main);
      outline: none;
    }

    [data-theme="dark"] .form-input {
      background: rgba(15, 23, 42, 0.5);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary-gold), var(--primary-red));
      color: #fff;
      border: none;
      padding: 0.85rem;
      border-radius: 12px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .result-box {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 12px;
      display: none;
    }

    .result-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--status-apto);
      color: var(--status-apto);
    }

    .result-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--status-inapto);
      color: var(--status-inapto);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <a href="index.html" class="brand-icon" style="text-decoration:none;">S</a>
      <div class="brand-text">
        <h1>Área de Fiscalização de Campo</h1>
        <p>SEMEPP - Prefeitura de Sorocaba</p>
      </div>
    </div>

    <div class="header-controls">
      <a href="index.html" class="btn-icon" title="Voltar ao Inicio" style="text-decoration:none;">🏠</a>
      <button class="btn-icon" id="theme-toggle">🌙</button>
    </div>
  </header>

  <main class="main-container">
    <div class="fiscal-grid">
      
      <!-- Coluna 1: Leitor de QR Code -->
      <div class="scanner-card">
        <h3>📷 Validador de QR Code do Ambulante</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
          Aponte a câmera para o QR Code exibido na Carteira Digital do comerciante.
        </p>

        <div id="reader"></div>

        <div id="qr-result" class="result-box">
          <strong id="qr-result-title"></strong>
          <p id="qr-result-desc" style="font-size: 0.85rem; margin-top: 0.3rem; color: var(--text-main);"></p>
        </div>
      </div>

      <!-- Coluna 2: Formulário de Vistoria de Campo -->
      <div class="vistoria-card">
        <h3>📋 Registro de Vistoria de Calçada</h3>
        <form id="form-vistoria" style="margin-top: 1rem;">
          
          <div class="form-group">
            <label for="f-protocolo">Protocolo / Nº Licença</label>
            <input type="text" id="f-protocolo" class="form-input" placeholder="ex: AMB-2026/0482" required />
          </div>

          <div class="form-group">
            <label for="f-fiscal">Nome do Fiscal</label>
            <input type="text" id="f-fiscal" class="form-input" value="Fiscal Carlos Eduardo (SEMEPP)" required />
          </div>

          <div class="form-group">
            <label for="f-calcada">Largura da Calçada (Metros)</label>
            <input type="number" step="0.1" id="f-calcada" class="form-input" placeholder="ex: 3.5" required />
          </div>

          <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="f-faixa-livre" checked />
            <label for="f-faixa-livre" style="margin:0;">Faixa livre para pedestres garantida (mín. 1,20m)</label>
          </div>

          <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="f-equipamento" checked />
            <label for="f-equipamento" style="margin:0;">Equipamento dentro do limite (2,00m x 2,00m)</label>
          </div>

          <div class="form-group">
            <label for="f-obs">Observações do Fiscal</label>
            <textarea id="f-obs" class="form-input" rows="3" placeholder="Informações relevantes sobre a vistoria..."></textarea>
          </div>

          <button type="submit" class="btn-submit">Salvar Vistoria no Servidor</button>
        </form>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/fiscal.js"></script>
</body>
</html>
