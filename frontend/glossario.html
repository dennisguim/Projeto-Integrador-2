<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossário Legal - SEMEPP Sorocaba</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Principal -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .glossary-hero {
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .glossary-hero h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }
    .glossary-hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .glossary-search-bar {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .glossary-input-wrapper {
      position: relative;
      flex: 1;
      min-width: 280px;
    }
    .glossary-input-wrapper input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--glass-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .glossary-input-wrapper input:focus {
      border-color: var(--primary-gold);
    }
    .glossary-input-wrapper svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .glossary-filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .filter-btn {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--glass-bg);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary-gold);
      color: #fff;
      border-color: var(--primary-gold);
    }
    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }
    .term-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
      box-shadow: var(--glass-shadow);
      transition: transform var(--transition-fast), border-color var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .term-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary-gold);
    }
    .term-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .term-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .term-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      background: rgba(230, 161, 0, 0.15);
      color: var(--primary-gold);
      white-space: nowrap;
      text-transform: uppercase;
    }
    .term-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .term-base-legal {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary-gold);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <a href="index.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Voltar
    </a>
    <h2>Glossário Legal & Regulatório</h2>
    <button id="theme-toggle" class="btn-icon" title="Alternar Tema"></button>
  </header>

  <!-- Conteúdo Principal -->
  <main class="content" style="max-width: 1200px; margin: 0 auto; width: 100%; padding: 1.5rem 1rem;">
    <section class="glossary-hero">
      <h2>Termos da Legislação de Comércio & Zoneamento</h2>
      <p>Consulte conceitos oficiais do Decreto Municipal nº 26.501/2021, Lei nº 12.368/2021 e Plano Diretor (Lei nº 13.123/2025).</p>
    </section>

    <!-- Pesquisa -->
    <div class="glossary-search-bar">
      <div class="glossary-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="glossary-search" placeholder="Pesquisar termo (ex: C.A.C.A., GRN, calçada, Categoria A, sachê...)" oninput="filtrarGlossario()">
      </div>
    </div>

    <!-- Filtros por Categoria -->
    <div class="glossary-filters">
      <button class="filter-btn active" onclick="setFiltroCategoria('todas', this)">Todas</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Comércio Fixo', this)">Comércio Fixo & CNAE</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Decreto 26.501', this)">Decreto nº 26.501/2021</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Equipamentos', this)">Equipamentos</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Regras Sanitárias', this)">Regras Sanitárias</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Restrições Urbanas', this)">Restrições Urbanas</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Zoneamento', this)">Zoneamento (Art. 118)</button>
      <button class="filter-btn" onclick="setFiltroCategoria('Órgãos', this)">Órgãos & Comissões</button>
    </div>

    <!-- Grid de Cards de Termos -->
    <div class="glossary-grid" id="glossary-grid">
      <!-- Injetado dinamicamente via js/glossario.js -->
    </div>
  </main>

  <footer class="footer" style="margin-top: 2rem;">
    <p>© 2026 Prefeitura Municipal de Sorocaba - Decreto nº 26.501/2021 & Lei nº 13.123/2025</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/glossario.js"></script>
</body>
</html>
